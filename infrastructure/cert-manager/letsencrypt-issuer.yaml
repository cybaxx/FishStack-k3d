apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wetfish-letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: letsencrypt@wetfish.net
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: api-token
      selector:
        dnsZones:
        - wetfishonline.com
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-wetfishnet
            key: api-token
      selector:
        dnsZones:
        - wetfish.net
