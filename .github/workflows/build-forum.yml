name: Build Forum
on:
  push:
    branches: [main, release]
    paths:
      - "services/forum/Dockerfile.*"
      - "services/forum/config/**"
      - "services/forum/fish/**"
      - "services/forum/wf-item-econ/**"
      - ".github/workflows/build-forum.yml"
      - ".github/workflows/build-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  SMF_VERSION: "2.1.6"

jobs:
  nginx:
    uses: ./.github/workflows/build-service.yml
    with:
      service: forum
      component: nginx
      dockerfile: services/forum/Dockerfile.nginx
      context: services/forum

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and prepare SMF ${{ env.SMF_VERSION }}
        run: |
          set -euo pipefail
          WORKDIR="/tmp/smf"
          mkdir -p "$WORKDIR"
          cd "$WORKDIR"

          echo "Downloading SMF v${SMF_VERSION}..."
          curl -fsSL -o smf-src.zip \
            "https://github.com/SimpleMachines/SMF/archive/refs/tags/v${SMF_VERSION}.zip"
          unzip -q smf-src.zip
          rm -f smf-src.zip

          cd "SMF-${SMF_VERSION}"

          echo "Promoting installer files from other/..."
          mv other/install.php install.php
          mv other/Settings.php Settings.php
          mv other/Settings_bak.php Settings_bak.php
          mv other/install_2-1_mysql.sql .
          mv other/install_2-1_postgresql.sql .
          rm -rf other

          echo "Creating runtime directories..."
          mkdir -p attachments cache avatars Smileys Themes Packages

          echo "Copying to services/forum/src/..."
          mkdir -p "$GITHUB_WORKSPACE/services/forum/src"
          shopt -s dotglob
          cp -a ./* "$GITHUB_WORKSPACE/services/forum/src/"
          ls -la "$GITHUB_WORKSPACE/services/forum/src/"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate timestamp
        id: timestamp
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/forum
          tags: |
            type=ref,event=branch,suffix=-php
            type=ref,event=tag,suffix=-php
            type=ref,event=pr,suffix=-php
            type=sha,format=long,suffix=-php
            type=raw,value=latest,suffix=-php,priority=900,enable={{is_default_branch}}
            type=raw,value=staging,suffix=-php,priority=1000,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=staging-php-${{ steps.timestamp.outputs.ts }},priority=1100,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=prod,suffix=-php,priority=1000,enable=${{ github.ref == format('refs/heads/{0}', 'release') }}
            type=raw,value=prod-php-${{ steps.timestamp.outputs.ts }},priority=1100,enable=${{ github.ref == format('refs/heads/{0}', 'release') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/forum
          file: services/forum/Dockerfile.php
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
