apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-mysql
spec:
  template:
    spec:
      containers:
      - name: mysql
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-web
spec:
  template:
    spec:
      containers:
      - name: nginx
        resources:
          requests:
            memory: "24Mi"
            cpu: "50m"
          limits:
            memory: "96Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 30
          failureThreshold: 5
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          failureThreshold: 5
          periodSeconds: 10
      - name: php-fpm
        resources:
          requests:
            memory: "96Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 30
          failureThreshold: 5
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 10
          failureThreshold: 5
          periodSeconds: 10
