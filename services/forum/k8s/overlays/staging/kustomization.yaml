apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wetfish-staging
resources:
  - ../../base
images:
  - name: FORUM_NGINX_IMAGE
    newName: ghcr.io/cybaxx/web-services-k8s/forum
    newTag: staging-nginx
  - name: FORUM_PHP_IMAGE
    newName: ghcr.io/cybaxx/web-services-k8s/forum
    newTag: staging-php
patches:
  - path: ingress-patch.yaml
  - path: env-patch.yaml
  - path: pull-secret-patch.yaml
  - path: nginx-configmap-patch.yaml
  - path: resource-patch.yaml
  - path: storage-patch.yaml
