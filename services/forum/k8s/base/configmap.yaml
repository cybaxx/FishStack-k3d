apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-nginx-config
  labels:
    app: forum
    component: web
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        # Restore real client IPs. Direct peer is Traefik (cluster CIDR); the
        # CF-Connecting-IP header it forwards is only honored from trusted peers.
        set_real_ip_from 10.42.0.0/16;
        set_real_ip_from 10.43.0.0/16;
        # Restore real client IPs from Cloudflare (all traffic arrives proxied).
        # Without this, PHP sees rotating CF edge IPs — breaks SMF session IP
        # checks, bans, throttles, and pollutes logs/analytics.
        # Ranges: https://www.cloudflare.com/ips/ (IPv4 + IPv6)
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header CF-Connecting-IP;

        root /var/www/forum;
        index index.php;
        disable_symlinks off;

        client_max_body_size 64M;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Block sensitive files
        location ~ /\.(git|env|htaccess|htpasswd) {
            deny all;
            return 404;
        }

        # Redirect legacy /forum/ URLs to forum root (migrated from /forum/ to /)
        location = /forum {
            return 301 https://$host/;
        }
        location ^~ /forum/ {
            if ($request_uri ~ ^/forum/(.*)$) {
                return 301 https://$host/$1;
            }
            return 301 https://$host/;
        }

        # Persistent user content dirs — served directly from appdata PVC via alias
        # (avoids symlink complexity; appdata mounted at /var/www/appdata)
        location ^~ /Themes/ {
            alias /var/www/appdata/Themes/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /attachments/ {
            alias /var/www/appdata/attachments/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /avatars/ {
            alias /var/www/appdata/avatars/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /custom_avatar/ {
            alias /var/www/appdata/custom_avatar/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /Smileys/ {
            alias /var/www/appdata/Smileys/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /images/ {
            alias /var/www/appdata/images/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }
        location ^~ /fish/ {
            alias /var/www/appdata/fish/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # Static asset caching
        location ~* \.(?:css|js|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public";
        }

        # PHP handler (php-fpm sidecar on 127.0.0.1:9000)
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        # SMF pretty-URL fallback
        location / {
            try_files $uri $uri/ /index.php?$args;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-php-config
  labels:
    app: forum
    component: web
data:
  php-fpm-pool.conf: |
    [www]
    user  = www-data
    group = www-data
    listen = 9000
    pm = dynamic
    pm.max_children    = 8
    pm.start_servers   = 2
    pm.min_spare_servers = 2
    pm.max_spare_servers = 4
    pm.max_requests    = 500

    ; Observability: fpm status (via fastcgi) + slow-request log to stderr
    pm.status_path     = /fpm-status
    slowlog            = /proc/self/fd/2
    request_slowlog_timeout = 3s

    access.log = /proc/self/fd/2
    catch_workers_output = yes

    ; Pass k8s secret env vars into php-fpm workers
    env[DB_HOST]          = $DB_HOST
    env[DB_PORT]          = $DB_PORT
    env[DB_NAME]          = $DB_NAME
    env[DB_USERNAME]      = $DB_USERNAME
    env[DB_PASSWORD]      = $DB_PASSWORD
    env[SITE_NAME]        = $SITE_NAME
    env[SITE_BOARDURL]    = $SITE_BOARDURL
    env[SITE_COOKIE_NAME] = $SITE_COOKIE_NAME
    env[SITE_LANGUAGE]    = $SITE_LANGUAGE
    env[OUTGOING_EMAIL]   = $OUTGOING_EMAIL
    env[SMF_AUTH_SECRET]  = $SMF_AUTH_SECRET

    php_flag[display_errors]        = off
    php_admin_value[error_log]      = /proc/self/fd/2
    php_admin_flag[log_errors]      = on

  php-overrides.ini: |
    date.timezone = America/Los_Angeles
    memory_limit = 64M
    upload_max_filesize = 8M
    post_max_size = 16M
    max_execution_time = 60

    ; Sessions must be cookie-only. URL-based session IDs (trans_sid) leak
    ; sessions via referrer headers/logs and cause "randomly logged out" reports.
    session.use_trans_sid = 0
    session.use_only_cookies = 1
