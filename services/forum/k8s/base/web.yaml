apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forum-wwwroot-pvc
  labels:
    app: forum
    component: web
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forum-appdata-pvc
  labels:
    app: forum
    component: web
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum-web
  labels:
    app: forum
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forum
      component: web
  template:
    metadata:
      labels:
        app: forum
        component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      # Seed wwwroot PVC from PHP image on first start
      initContainers:
      - name: seed-wwwroot
        image: FORUM_PHP_IMAGE:latest
        command: ['sh', '-c', 'cp -rn /var/www/forum/. /data/ || true']
        volumeMounts:
        - name: wwwroot
          mountPath: /data

      containers:
      # Nginx container
      - name: nginx
        image: FORUM_NGINX_IMAGE:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: nginx.conf
        - name: wwwroot
          mountPath: /var/www/forum
        - name: appdata
          mountPath: /var/www/appdata
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

      # PHP-FPM sidecar
      - name: php-fpm
        image: FORUM_PHP_IMAGE:latest
        ports:
        - containerPort: 9000
          name: php-fpm
        env:
        - name: DB_HOST
          value: "forum-mysql"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: forum-mysql-secret
              key: mysql-database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: forum-mysql-secret
              key: mysql-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: forum-mysql-secret
              key: mysql-password
        - name: SMF_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: forum-app-secret
              key: auth-secret
        - name: SITE_NAME
          value: "Wetfish Online"
        - name: SITE_BOARDURL
          value: "PLACEHOLDER"
        - name: SITE_COOKIE_NAME
          value: "SMFDev"
        - name: SITE_LANGUAGE
          value: "english"
        - name: OUTGOING_EMAIL
          value: "noreply@wetfishonline.com"
        - name: SMF_CACHE_ENABLE
          value: "1"
        - name: SMF_CACHE_ACCELERATOR
          value: "FileBased"
        - name: SMF_CACHE_DIR
          value: "/var/www/forum/cache"
        - name: SMF_SMTP_HOST
          value: "smtp-relay.brevo.com"
        - name: SMF_SMTP_PORT
          value: "587"
        - name: SMF_SMTP_USERNAME
          value: "9e2063001@smtp-brevo.com"
        - name: SMF_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: forum-app-secret
              key: smtp-password
        - name: SMF_MAIL_TYPE
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: php-config
          mountPath: /usr/local/etc/php-fpm.d/zz-forum-pool.conf
          subPath: php-fpm-pool.conf
        - name: wwwroot
          mountPath: /var/www/forum
        - name: appdata
          mountPath: /var/www/appdata
        livenessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9000
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
      - name: nginx-config
        configMap:
          name: forum-nginx-config
      - name: php-config
        configMap:
          name: forum-php-config
      - name: wwwroot
        persistentVolumeClaim:
          claimName: forum-wwwroot-pvc
      - name: appdata
        persistentVolumeClaim:
          claimName: forum-appdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: forum-web
  labels:
    app: forum
    component: web
spec:
  selector:
    app: forum
    component: web
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
